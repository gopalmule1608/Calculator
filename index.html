<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <div class="displaybox">
            <input type="text" id="display" disabled placeholder="0">
        </div>
        <div class="allbutton">
            <div class="buttons">
                <button id="btn" style="background-color: #eef5fd; color: tomato; font-weight: bold;">Ac</button>
                <button id="btn" style="background-color: #eef5fd;   font-weight: bold;">Del</button>
                <button id="btn" style="background-color: #eef5fd;  font-weight: bold;">%</button>
                <button id="btn" style="background-color: orange; color: white; font-weight: bold;">/</button>
            </div>

            <div class="buttons">
                <button id="btn">7</button>
                <button id="btn">8</button>
                <button id="btn">9</button>
                <button id="btn" style="background-color: orange; color: white; font-weight: bold;">*</button>
            </div>

            <div class="buttons">
                <button id="btn">4</button>
                <button id="btn">5</button>
                <button id="btn">6</button>
                <button id="btn" style="background-color: orange; color: white; font-weight: bold;">-</button>
            </div>

            <div class="buttons">
                <button id="btn">1</button>
                <button id="btn">2</button>
                <button id="btn">3</button>
                <button id="btn" style="background-color: orange; color: white; font-weight: bold;">+</button>
            </div>

            <div class="buttons">
                <button class="doubble_width" id="btn"
                    style="background-color: skyblue; color: white; font-weight: bold; ">0</button>
                <button id="btn">.</button>
                <button id="btn" style="background-color: orange; color: white; font-weight: bold;">=</button>

            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
